[package]
name = "mylittlechart-app-shell-vello"
version.workspace = true
edition.workspace = true
description = "Standalone chart vello/winit runner — like terminal-vello but for chart-app"

[[bin]]
name = "mylittlechart"
path = "src/main.rs"

[dependencies]
web-time = "1"
mlc-shell-diagnostics = { path = "../mlc-shell-diagnostics", package = "mylittlechart-shell-diagnostics" }
mlc-app = { path = "../mlc-app", package = "mylittlechart-app" }
mlc-app-sidebar-content = { path = "../mlc-app-sidebar-content", package = "mylittlechart-app-sidebar-content" }
mlc-alert-delivery = { path = "../mlc-alert-delivery", package = "mylittlechart-alert-delivery" }
mlc-backend-data-bridge = { path = "../mlc-backend-data-bridge", package = "mylittlechart-backend-data-bridge" }
mlc-app-render-context-vello = { path = "../mlc-app-render-context-vello", package = "mylittlechart-app-render-context-vello" }
mlc-core = { path = "../mlc-core", package = "mylittlechart-core" }
mlc-app-input-shell = { path = "../mlc-app-input-shell", package = "mylittlechart-app-input-shell" }
mlc-vault = { path = "../mlc-vault", package = "mylittlechart-vault" }
mlc-app-layout = { path = "../mlc-app-layout", package = "mylittlechart-app-layout" }
uzor = "=1.5.2"
vello = "0.9"
winit = "0.30"
pollster = "0.4"
png = "0.17"
arboard = "3"
tokio = { version = "1", features = ["sync"] }
serde_json = "1"
# default-features off: every other crate in the graph (mlc-updater,
# mlc-alert-delivery, mlc-shell-diagnostics, ...) pins rustls-tls with
# default-features=false. Leaving this on pulls in native-tls (reqwest's
# "default-tls" default feature) alongside rustls in the same binary.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
mlc-updater = { path = "../mlc-updater", package = "mylittlechart-updater" }
mlc-backend-shell-http = { path = "../mlc-backend-shell-http", package = "mylittlechart-backend-shell-http" }
mlc-app-agent-api = { path = "../mlc-app-agent-api", package = "mylittlechart-app-agent-api" }
mlc-backend-indicator-engine = { path = "../mlc-backend-indicator-engine", package = "mylittlechart-backend-indicator-engine" }
mlc-backend = { path = "../mlc-backend", package = "mylittlechart-backend" }
sysinfo = "0.34"
mlc-app-render-context-instanced = { path = "../mlc-app-render-context-instanced", package = "mylittlechart-app-render-context-instanced" }
uzor-render-wgpu-instanced = "=1.5.2"
mlc-app-render-context-vello-cpu = { path = "../mlc-app-render-context-vello-cpu", package = "mylittlechart-app-render-context-vello-cpu" }
mlc-app-render-context-vello-hybrid = { path = "../mlc-app-render-context-vello-hybrid", package = "mylittlechart-app-render-context-vello-hybrid" }
uzor-render-vello-hybrid = "=1.5.2"
vello_hybrid = { version = "0.0.9", features = ["wgpu"] }
mlc-app-render-context-tiny-skia = { path = "../mlc-app-render-context-tiny-skia", package = "mylittlechart-app-render-context-tiny-skia" }
keyring = "3"
base64.workspace = true

[build-dependencies]
winresource = "0.1"

[features]
# ON by default. Every cloud-facing surface in the graph — the chrome's
# sign-in/account button, `CloudLoginPhase`, the settings modal's cloud
# pages — is behind `cloud` in mlc-core/mlc-app/mlc-app-layout/
# mlc-app-input-shell, and this shell never turned it on: the code was in
# the tree and compiled out of the shipped binary (found 2026-09-03).
#
# Opt-in is what the web shell does, because `package-app.sh` passes the
# flag. Nothing in this tree builds the native binary, so an opt-in flag
# here is a switch no caller ever flips — the same silent strip that hit
# the wasm stand on 2026-08-31. The OSS lite build is a separate repo
# (§ oss/prop split), not a feature of this crate; `--no-default-features`
# stays available for it.
#
# `mlc-cloud` is deliberately absent: it is the wasm transport. Native
# talks to the server through `mlc-updater` (loopback OAuth + sync), which
# is an unconditional dependency above.
default = ["cloud"]
cloud = [
    "mlc-core/cloud",
    "mlc-app/cloud",
    "mlc-app-layout/cloud",
    "mlc-app-input-shell/cloud",
    "mlc-app-agent-api/cloud",
]

[lints]
workspace = true
