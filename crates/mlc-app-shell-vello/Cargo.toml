[package]
name = "mylittlechart"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GPU-accelerated desktop charting and order-flow terminal for 18 crypto exchanges. 480+ indicators, multi-window, scriptable agent API."

[[bin]]
name = "mylittlechart"
path = "src/main.rs"

[dependencies]
tracing = "0.1"
web-time = "1"
mlc-shell-diagnostics = { version = "0.5.656", path = "../mlc-shell-diagnostics", package = "mylittlechart-shell-diagnostics" }
mlc-app = { version = "0.1.0", path = "../mlc-app", package = "mylittlechart-app" }
mlc-app-sidebar-content = { version = "0.1.0", path = "../mlc-app-sidebar-content", package = "mylittlechart-app-sidebar-content" }
mlc-alert-delivery = { version = "0.5.656", path = "../mlc-alert-delivery", package = "mylittlechart-alert-delivery" }
mlc-backend-data-bridge = { version = "0.5.656", path = "../mlc-backend-data-bridge", package = "mylittlechart-backend-data-bridge" }
mlc-app-render-context-vello = { version = "0.5.656", path = "../mlc-app-render-context-vello", package = "mylittlechart-app-render-context-vello" }
mlc-core = { version = "0.5.656", path = "../mlc-core", package = "mylittlechart-core" }
mlc-app-input-shell = { version = "0.5.656", path = "../mlc-app-input-shell", package = "mylittlechart-app-input-shell" }
mlc-vault = { version = "0.5.656", path = "../mlc-vault", package = "mylittlechart-vault" }
mlc-app-layout = { version = "0.5.656", path = "../mlc-app-layout", package = "mylittlechart-app-layout" }
# `messenger_io.rs`'s own I/O glue over `mlc_messenger::driver::MessengerDriver`
# (M15 piece D1/D2) -- not wired into `ChartApp` yet (the MLC coordinator
# does that separately).
mlc-messenger = { version = "0.5.656", path = "../mlc-messenger", package = "mylittlechart-messenger" }
# `messenger_io.rs` wraps the vault key it's handed as `Zeroizing<[u8; 32]>`
# before handing it to `MessengerDriver::new` -- already a direct dependency
# of `mlc-vault`/`mlc-messenger` themselves, so this adds no new
# supply-chain surface.
zeroize = "1"
# Native messenger file. This shell is not the wasm target. The file holds
# the engine's sealed records; the engine stays sans-I/O.
# gate4agent 0.4.8 does not link sqlite. This is the one sqlite in the
# native binary: SQLCipher, rusqlite 0.40. System OpenSSL comes from
# `nemo/.cargo/config.toml`. Vendored OpenSSL stays off.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
hex.workspace = true
uzor = "=1.5.3"
vello = "0.9"
winit = "0.30"
pollster = "0.4"
png = "0.17"
arboard = "3"
tokio = { version = "1", features = ["sync"] }
serde_json = "1"
# default-features off: every other crate in the graph (mlc-updater,
# mlc-alert-delivery, mlc-shell-diagnostics, ...) pins rustls-tls with
# default-features=false. Leaving this on pulls in native-tls (reqwest's
# "default-tls" default feature) alongside rustls in the same binary.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
mlc-updater = { version = "0.5.656", path = "../mlc-updater", package = "mylittlechart-updater" }
mlc-backend-shell-http = { version = "0.5.656", path = "../mlc-backend-shell-http", package = "mylittlechart-backend-shell-http" }
mlc-app-agent-api = { version = "0.5.656", path = "../mlc-app-agent-api", package = "mylittlechart-app-agent-api" }
mlc-backend-indicator-engine = { version = "0.1.0", path = "../mlc-backend-indicator-engine", package = "mylittlechart-backend-indicator-engine" }
mlc-backend = { version = "0.5.656", path = "../mlc-backend", package = "mylittlechart-backend" }
sysinfo = "0.34"
mlc-app-render-context-instanced = { version = "0.1.0", path = "../mlc-app-render-context-instanced", package = "mylittlechart-app-render-context-instanced" }
uzor-render-wgpu-instanced = "=1.5.3"
mlc-app-render-context-vello-cpu = { version = "0.1.0", path = "../mlc-app-render-context-vello-cpu", package = "mylittlechart-app-render-context-vello-cpu" }
mlc-app-render-context-vello-hybrid = { version = "0.1.0", path = "../mlc-app-render-context-vello-hybrid", package = "mylittlechart-app-render-context-vello-hybrid" }
uzor-render-vello-hybrid = "=1.5.3"
vello_hybrid = { version = "0.0.9", features = ["wgpu"] }
mlc-app-render-context-tiny-skia = { version = "0.5.656", path = "../mlc-app-render-context-tiny-skia", package = "mylittlechart-app-render-context-tiny-skia" }
keyring = "3"
base64.workspace = true

[build-dependencies]
winresource = "0.1"

[features]
# ON by default. Every cloud-facing surface in the graph — the chrome's
# sign-in/account button, `CloudLoginPhase`, the settings modal's cloud
# pages — is behind `cloud` in mlc-core/mlc-app/mlc-app-layout/
# mlc-app-input-shell, and this shell never turned it on: the code was in
# the tree and compiled out of the shipped binary (found 2026-09-03).
#
# Opt-in is what the web shell does, because `package-app.sh` passes the
# flag. Nothing in this tree builds the native binary, so an opt-in flag
# here is a switch no caller ever flips — the same silent strip that hit
# the wasm stand on 2026-08-31. The OSS lite build is a separate repo
# (§ oss/prop split), not a feature of this crate; `--no-default-features`
# stays available for it.
#
# `mlc-cloud` is deliberately absent: it is the wasm transport. Native
# talks to the server through `mlc-updater` (loopback OAuth + sync), which
# is an unconditional dependency above.
default = ["cloud"]
cloud = [
    "mlc-core/cloud",
    "mlc-app/cloud",
    "mlc-app-layout/cloud",
    "mlc-app-input-shell/cloud",
    "mlc-app-agent-api/cloud",
]

[lints]
workspace = true
