[package]
name = "mylittlechart-backend-test-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Test harness for mlc-backend + mlc-backend-shell-daemon + mlc-backend-shell-http. Spins a real BackendCore, drives it with synthetic LiveUpdates, talks to the daemon over HTTP. Not a tests/ folder — a real lib crate so it can be reused by other consumers."

[lib]
name = "mlc_backend_test_harness"

[dependencies]
web-time = "1"
mlc-backend = { path = "../mlc-backend", package = "mylittlechart-backend" }
mlc-backend-data-bridge = { path = "../mlc-backend-data-bridge", package = "mylittlechart-backend-data-bridge" }
mlc-core = { path = "../mlc-core", package = "mylittlechart-core" }
digdigdig3 = "=0.3.32"
digdigdig3-station = "=0.3.32"
serde_json = "1"

# tokio surface differs sharply: native uses multi-thread runtime + process
# spawn (for DaemonGuard) and reqwest for HTTP; wasm uses only the sync
# primitives + macros and has no daemon-spawn / HTTP-runner story (those
# scenarios are cfg-gated out on wasm32).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# shell-http tugs in axum + full tokio; native-only because both fail to
# compile to wasm32 (mio / socket2 dependencies).
mlc-backend-shell-http = { path = "../mlc-backend-shell-http", package = "mylittlechart-backend-shell-http" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]

[lints]
workspace = true
