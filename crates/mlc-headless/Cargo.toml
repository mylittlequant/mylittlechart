[package]
name = "mylittlechart-headless"
version.workspace = true
edition.workspace = true
description = "Render-agnostic mylittlechart backend daemon. Owns ChartApp + AgentState + HTTP server, ticks at 60Hz, has no GPU."

[[bin]]
name = "mlc-headless"
path = "src/main.rs"

[dependencies]
web-time = "1"
mlc-app = { path = "../mlc-app", package = "mylittlechart-app" }
mlc-core = { path = "../mlc-core", package = "mylittlechart-core" }
mlc-headless-core = { path = "../mlc-headless-core", package = "mylittlechart-headless-core" }
mlc-agentic-server = { path = "../mlc-agentic-server", package = "mylittlechart-agentic-server" }
mlc-live-data = { path = "../mlc-live-data", package = "mylittlechart-live-data" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
