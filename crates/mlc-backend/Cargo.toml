[package]
name = "mylittlechart-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared data plane (bridge + bubble + indicators + trading + presets) for every mylittlechart consumer — embedded apps and the headless backend daemon."

[lib]
name = "mlc_backend"

[dependencies]
web-time = "1"
log = "0.4"
mlc-core = { version = "0.5.656", path = "../mlc-core", package = "mylittlechart-core" }
mlc-vault = { version = "0.5.656", path = "../mlc-vault", package = "mylittlechart-vault" }
mlc-backend-indicator-engine = { version = "0.1.0", path = "../mlc-backend-indicator-engine", package = "mylittlechart-backend-indicator-engine" }
mlc-backend-data-bridge = { version = "0.5.656", path = "../mlc-backend-data-bridge", package = "mylittlechart-backend-data-bridge" }
mlc-backend-trading-engine = { version = "0.5.656", path = "../mlc-backend-trading-engine", package = "mylittlechart-backend-trading-engine" }
digdigdig3 = "=0.3.32"
digdigdig3-station = "=0.3.32"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = { workspace = true }
rust_decimal = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native owns the tokio Runtime for the bridge / gate4agent; needs full rt
# (rt-multi-thread pulls mio which doesn't compile on wasm32-unknown-unknown).
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Wasm: no runtime — spawn_local handles tasks. Sync primitives only.
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
# TradingManager::spawn_task wasm arm (fire-and-forget trading API calls).
wasm-bindgen-futures = "0.4"

[lints]
workspace = true
