[package]
name = "mylittlechart-app-shell-cli"
version.workspace = true
edition.workspace = true
description = "Dual-mode CLI for the mlc backend. Default: HTTP client against a running mlc-backend-shell-daemon. Mirrors every Mode-2 control plane endpoint as a flat sub-command."

[[bin]]
name = "mlc"
path = "src/main.rs"

[dependencies]
web-time = "1"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-std", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures-util = "0.3"
eventsource-stream = "0.2"
