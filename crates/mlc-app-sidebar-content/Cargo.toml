[package]
name = "mylittlechart-app-sidebar-content"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Right-sidebar content rendering for the chart application."

[lib]
name = "mlc_app_sidebar_content"

[dependencies]
web-time = "1"
mlc-core = { version = "0.5.656", path = "../mlc-core", package = "mylittlechart-core" }
mlc-app-layout = { version = "0.5.656", path = "../mlc-app-layout", package = "mylittlechart-app-layout" }
uzor = "=1.5.35"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gate4agent = { version = "=0.4.8", optional = true }

[features]
default = ["agents"]
# The real gate4agent types (desktop). Off: the no-op stub (wasm, mobile).
agents = ["dep:gate4agent"]

[dev-dependencies]
serde_json = "1.0"

[lints]
workspace = true
