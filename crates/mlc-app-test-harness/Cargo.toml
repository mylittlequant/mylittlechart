[package]
name = "mlc-app-test-harness"
version.workspace = true
edition.workspace = true
description = "Headless debug harness for mlc — fast iteration on routing / lifecycle / data-flow logic without the 16-min release build."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "mlc_app_test_harness"
path = "src/lib.rs"

[dependencies]
web-time = "1"
mlc-core = { path = "../mlc-core", package = "mylittlechart-core" }
mlc-backend = { path = "../mlc-backend", package = "mylittlechart-backend" }
mlc-app = { path = "../mlc-app", package = "mylittlechart-app" }
mlc-backend-data-bridge = { path = "../mlc-backend-data-bridge", package = "mylittlechart-backend-data-bridge" }
digdigdig3 = "=0.3.26"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }

[[test]]
name = "unit_bubble_routing"
path = "tests/unit/bubble_routing.rs"

[[test]]
name = "integration_tick_bars_loaded"
path = "tests/integration/tick_bars_loaded.rs"

[[test]]
name = "e2e_chartapp_full_load"
path = "tests/e2e/chartapp_full_load.rs"

[[test]]
name = "e2e_headless_full_lifecycle"
path = "tests/e2e/headless_full_lifecycle.rs"
