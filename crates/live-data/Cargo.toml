[package]
name = "live-data"
version.workspace = true
edition.workspace = true

[dependencies]
# Chart types (Bar, Timeframe, DataProvider trait)
zengeld-chart = { path = "../chart" }

# Bar cache persistence
bar-store = { path = "../bar-store" }

# Shared in-memory bar series (replaces DataBridge's internal bar_cache)
bar-service = { path = "../bar-service" }

# Shared in-memory trade rings
trade-service = { path = "../trade-service" }

# Shared in-memory orderbook series
orderbook-service = { path = "../orderbook-service" }

# V5 connectors (async exchange API) — separate workspace, use path
digdigdig3 = "=0.3.12"

# Station: warm-start, persistence, gap-heal, replay over the same connectors.
# Phase 2 of the dig3+mli migration: live-data becomes a strict facade over
# Station — Station owns disk persistence + reconnect + gap fill; live-data
# only translates between station Events and the legacy LiveUpdate API the
# rest of mlc still uses, plus the three channels station doesn't cover
# (private streams, scroll-left pagination, exchange_info).
digdigdig3-station = "=0.3.12"

# Async runtime for background tasks
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

# Stream utilities for WebSocket event_stream() consumption
futures-util = "0.3"

# Raw WebSocket connection for special all-market streams (e.g. !miniTicker@arr)
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }

# JSON parsing for mini ticker WebSocket messages
serde_json = "1.0"
