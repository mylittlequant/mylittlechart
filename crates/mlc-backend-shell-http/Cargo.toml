[package]
name = "mylittlechart-backend-shell-http"
version.workspace = true
edition.workspace = true

[lib]
name = "mlc_backend_shell_http"

[dependencies]
web-time = "1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
base64 = "0.22"
socket2 = "0.5"

# Workspace path dependencies
mlc-backend-data-bridge = { path = "../mlc-backend-data-bridge", package = "mylittlechart-backend-data-bridge" }
mlc-backend = { path = "../mlc-backend", package = "mylittlechart-backend" }
