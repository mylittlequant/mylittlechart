[package]
name = "mylittlechart-app-layout"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop/wasm frontend layer for mylittlechart — layout, render, ui widgets, hit-testing, input. Consumes mlc-core state; temporary until the tessera app shell lands."

[lib]
name = "mlc_app_layout"
path = "src/lib.rs"

[dependencies]
web-time = "1"
mlc-core = { version = "0.5.656", path = "../mlc-core", package = "mylittlechart-core" }
mlc-alert-delivery = { version = "0.5.656", path = "../mlc-alert-delivery", package = "mylittlechart-alert-delivery" }
mlc-messenger-model = { version = "0.5.656", path = "../mlc-messenger-model", package = "mylittlechart-messenger-model" }
uzor = "=1.5.3"
uzor-text = "=1.5.3"

[lints]
workspace = true

[features]
default = []
cloud = ["mlc-core/cloud"]
