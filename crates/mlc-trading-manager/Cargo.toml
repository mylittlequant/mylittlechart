[package]
name = "mylittlechart-trading-manager"
version.workspace = true
edition.workspace = true

[lib]
name = "mlc_trading_manager"

[dependencies]
web-time = "1"
digdigdig3 = "=0.3.23"
mlc-core = { path = "../mlc-core", package = "mylittlechart-core" }
mlc-live-data = { path = "../mlc-live-data", package = "mylittlechart-live-data" }
rust_decimal = "1"
tokio = { version = "1", features = ["sync", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
