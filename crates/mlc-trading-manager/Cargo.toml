[package]
name = "mylittlechart-trading-manager"
version.workspace = true
edition.workspace = true

[lib]
name = "mlc_trading_manager"

[dependencies]
digdigdig3 = "=0.3.19"
mlc-live-data = { path = "../mlc-live-data", package = "mylittlechart-live-data" }
mlc-orderbook-service = { path = "../mlc-orderbook-service", package = "mylittlechart-orderbook-service" }
tokio = { version = "1", features = ["sync", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
