[package]
name = "mylittlechart-sidebar-content"
version = "0.1.0"
edition = "2021"

[lib]
name = "mlc_sidebar_content"

[dependencies]
web-time = "1"
mlc-core = { path = "../mlc-core", package = "mylittlechart-core" }
mlc-layout = { path = "../mlc-layout", package = "mylittlechart-layout" }
uzor = "=1.4.15"
mlc-alerts = { path = "../mlc-alerts", package = "mylittlechart-alerts" }
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gate4agent = "=0.2.37"

[dev-dependencies]
serde_json = "1.0"
