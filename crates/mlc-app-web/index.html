<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>mylittlechart — web</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #131722; }
    #chart {
      display: block;
      width: 100%;
      height: 100%;
      /* Canvas pixel buffer is set by Rust; CSS dimensions drive logical size */
    }
  </style>
</head>
<body>
  <canvas id="chart"></canvas>

  <!--
    wasm-pack outputs:
      dist/mlc-app-web/mlc_app_web.js       (ES module glue)
      dist/mlc-app-web/mlc_app_web_bg.wasm  (binary)

    Adjust the path to wherever you pointed --out-dir.
  -->
  <script>
    // Capture unhandled errors / rejections BEFORE wasm init.
    // STORE the first error in globalThis so dev-attach --eval can pull it
    // out as a single string (avoids dev-attach's multi-arg console truncation).
    window.__MLC_FIRST_ERROR__ = null;
    window.__MLC_ERROR_COUNT__ = 0;
    function captureError(label, msg, file, line, col, errObj) {
      window.__MLC_ERROR_COUNT__++;
      if (window.__MLC_FIRST_ERROR__) return;  // keep only the first
      var stack = (errObj && errObj.stack) || '<no stack>';
      window.__MLC_FIRST_ERROR__ = JSON.stringify({
        label: label,
        msg: String(msg),
        file: file || '<none>',
        line: line || 0,
        col: col || 0,
        stack: stack
      });
      // Also dump to console as ONE message (single arg) so dev-attach gets it whole.
      console.error('[FIRST-WINDOW-ERROR] ' + window.__MLC_FIRST_ERROR__);
    }
    window.addEventListener('error', function(e) {
      captureError('error', e.message, e.filename, e.lineno, e.colno, e.error);
    });
    window.addEventListener('unhandledrejection', function(e) {
      captureError('unhandledrejection', e.reason, '', 0, 0, e.reason);
    });
  </script>
  <script type="module">
    import init from './mlc_app_web.js';
    await init();
    // The #[wasm_bindgen(start)] fn is called automatically by init().
  </script>
</body>
</html>
