[package]
name = "mylittlechart-app-shell-daemon-lightweight"
version.workspace = true
edition.workspace = true
description = "Mode-2 backend daemon — Arc<BackendCore> + HTTP server, no embedded ChartApp. N external apps attach over HTTP/WS."

[[bin]]
name = "mlc-app-shell-daemon-lightweight"
path = "src/main.rs"

[dependencies]
web-time = "1"
mlc-backend = { path = "../mlc-backend", package = "mylittlechart-backend" }
mlc-backend-data-bridge = { path = "../mlc-backend-data-bridge", package = "mylittlechart-backend-data-bridge" }
mlc-core = { path = "../mlc-core", package = "mylittlechart-core" }
mlc-backend-indicator-engine = { path = "../mlc-backend-indicator-engine", package = "mylittlechart-backend-indicator-engine" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
axum = { version = "0.7", features = ["http1", "json"] }
tower = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
