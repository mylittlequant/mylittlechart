[package]
name = "mylittlechart-backend-trading-engine"
version.workspace = true
edition.workspace = true

[lib]
name = "mlc_backend_trading_engine"

[dependencies]
digdigdig3 = "=0.3.30"
mlc-core = { path = "../mlc-core", package = "mylittlechart-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
