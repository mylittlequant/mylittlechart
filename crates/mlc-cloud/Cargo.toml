[package]
name = "mylittlechart-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cloud sync client for the MLC server API — serde models + transport. Wasm32 transport via web-sys fetch; native transport lands with updater phase 2."

[lib]
name = "mlc_cloud"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ── wasm32 transport ─────────────────────────────────────────────────────────
# Same pattern as mlc-vault: the fetch transport only compiles on wasm32;
# native `cargo check --workspace` sees models + config only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
web-sys              = { version = "0.3", features = [
    "Window",
    "Request",
    "RequestInit",
    "RequestMode",
    "RequestCache",
    "Response",
    "Headers",
    # /api/share/screenshot multipart upload
    "FormData",
    "Blob",
] }

[lints]
workspace = true
