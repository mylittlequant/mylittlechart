[package]
name = "mylittlechart-app-shell-web"
version.workspace = true
edition.workspace = true

[lib]
name = "mlc_app_shell_web"
crate-type = ["cdylib", "rlib"]

# ── Spike: only meaningful on wasm32 ─────────────────────────────────────────
# The entire crate body is cfg-gated under #[cfg(target_arch = "wasm32")] so
# `cargo check --workspace` (native) compiles it as an empty lib without error.
# Use `cargo check -p mylittlechart-app-shell-web --target wasm32-unknown-unknown`
# for the real gate.

[dependencies]
# MLC lib graph — all 12 lib crates compile to wasm32 after Phase 0-2
mlc-app          = { path = "../mlc-app",          package = "mylittlechart-app"          }
mlc-app-input-shell  = { path = "../mlc-app-input-shell",  package = "mylittlechart-app-input-shell"  }
mlc-app-layout    = { path = "../mlc-app-layout",    package = "mylittlechart-app-layout"    }
mlc-app-sidebar-content = { path = "../mlc-app-sidebar-content", package = "mylittlechart-app-sidebar-content" }
mlc-backend-data-bridge    = { path = "../mlc-backend-data-bridge",    package = "mylittlechart-backend-data-bridge"    }
mlc-backend = { path = "../mlc-backend", package = "mylittlechart-backend" }
mlc-core         = { path = "../mlc-core",         package = "mylittlechart-core"         }
# Cloud sync client (server API). Optional: official builds enable the
# `cloud` feature; a bare OSS checkout builds the purely local chart.
mlc-cloud        = { path = "../mlc-cloud",        package = "mylittlechart-cloud", optional = true }
# DM crypto (`mlc_vault::dm`) for the Community modal's Messages tab —
# paid web users hold the vault too (owner ruling 2026-09-09); E2E rides
# through the server, which never decrypts. Already resolves to wasm32 as
# a transitive dep of `mlc-backend`/`mlc-app` here — this crate calls it
# directly only from `cloud_session.rs`, hence gated with `cloud` below
# rather than pulled in unconditionally.
mlc-vault        = { path = "../mlc-vault",        package = "mylittlechart-vault", optional = true }
# `messenger_io.rs`: the web glue over `mlc_messenger::driver::MessengerDriver` (fetch +
# IndexedDB + a Web Lock). Gated with `cloud` like `mlc-vault`: the messenger talks to
# the account server with the cloud bearer token and is keyed by the vault.
mlc-messenger    = { path = "../mlc-messenger",    package = "mylittlechart-messenger", optional = true }
# `VaultState` (the "open in another tab" state a waiting tab reports) lives in the
# messenger view-model leaf; `mlc-messenger` does not re-export it. Already in the
# graph through `mlc-messenger`, so this adds no new package.
mlc-messenger-model = { path = "../mlc-messenger-model", package = "mylittlechart-messenger-model", optional = true }
# `messenger_io.rs` wraps the vault key as `Zeroizing<[u8; 32]>` for `MessengerDriver::new`
# (same use as `mlc-app-shell-vello`); already a dependency of `mlc-vault`/`mlc-messenger`.
zeroize          = { version = "1", optional = true }

# uzor web bindings — wasm32-only at runtime, but the Cargo.toml deps are
# unconditional so cargo can resolve the graph on native (the cfg-gate in
# src/lib.rs keeps the code from compiling native-side).
uzor                  = "=1.5.3"
uzor-window-web       = "=1.5.3"
uzor-render-canvas2d  = "=1.5.3"

# Alternative render backends — commented out for the spike to keep the wasm
# output small.  To switch backends, uncomment the dep, add an optional dep
# pin, and update the `RenderBackend` arm in `run_render_loop`.
# uzor-render-vello-cpu    = { version = "=1.4.16", optional = true }
# uzor-render-vello-hybrid = { version = "=1.4.16", optional = true }
# uzor-render-vello-gpu    = { version = "=1.4.16", optional = true }

digdigdig3 = "=0.3.31"

# wasm-bindgen ecosystem
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
web-sys              = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "Performance",
    "console",
    "CssStyleDeclaration",
    "Blob",
    "Clipboard",
    "ClipboardItem",
    "Navigator",
    "StorageManager",
    "Storage",
    "Crypto",
    "MediaQueryList",
    "Url",
    "Location",
    "HtmlElement",
    "HtmlAnchorElement",
    "WebSocket",
    "MessageEvent",
    # `messenger_io.rs` (fetch + IndexedDB + Web Locks glue for the messenger driver)
    "Request",
    "RequestInit",
    "RequestMode",
    "RequestCache",
    "Headers",
    "Response",
    "AbortController",
    "AbortSignal",
    "UrlSearchParams",
    "Event",
    "EventTarget",
    "WheelEvent",
    "DomStringList",
    "IdbFactory",
    "IdbDatabase",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbObjectStore",
    "IdbKeyRange",
    "CloseEvent",
] }
console_error_panic_hook = "0.1"
serde_json = "1.0"
# Wasm tracing subscriber — pipes every `tracing::info!/warn!/debug!/trace!`
# call from dig3 + digdigdig3-station into the browser console. This is the
# ONLY way to see Station internals (UniversalWsTransport heal loops, WS
# silence-timer re-subscribe, mux entry lifecycle) on wasm; without it those
# events vanish silently and the bridge looks idle when it's actually spinning.
tracing      = "0.1"
tracing-wasm = "0.2"
# log→tracing bridge: mlc-app logs via the `log` crate; without this bridge
# every log::warn!/info! from the app layer is invisible in the browser
# console (only dig3's native `tracing` calls got through).
tracing-log  = "0.2"

# Tokio sync primitives — wasm32 uses the `sync + macros` subset; no rt
tokio    = { version = "1", default-features = false, features = ["sync", "macros"] }
web-time = "1"
# Base64 for DM ciphertext/nonce/public-key wire encoding (`cloud_session.rs`)
# — same crate + version `mlc-app-shell-vello`/`mlc-updater` already use for
# the identical purpose natively.
base64   = { workspace = true, optional = true }

[features]
default = []
# Server connectivity (auth + sync via /api/*). Enabled for official builds
# (package-app.sh passes --features cloud); OSS self-builds stay local-only.
cloud = ["dep:mlc-cloud", "dep:mlc-vault", "dep:mlc-messenger", "dep:mlc-messenger-model", "dep:zeroize", "dep:base64", "mlc-core/cloud", "mlc-app-layout/cloud", "mlc-app/cloud", "mlc-app-input-shell/cloud"]
# Uncomment when ready to wire in alternative backends:
# render-vello-cpu    = ["dep:uzor-render-vello-cpu"]
# render-vello-hybrid = ["dep:uzor-render-vello-hybrid"]
# render-vello-gpu    = ["dep:uzor-render-vello-gpu"]

[lints]
workspace = true
