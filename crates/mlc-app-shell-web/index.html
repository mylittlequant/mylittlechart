  <!--
    SOURCE OF TRUTH: this file (`crates/mlc-app-shell-web/index.html`) owns
    the boot markup/CSS/dismissal logic. Production
    (`mylittlechart-landing/web/app/index.html` + `app-boot.js`) mirrors it —
    same `#boot` markup, same styles, same dismissal poll — split into an
    external script only because that site's CSP forbids inline scripts
    (`script-src 'self' 'wasm-unsafe-eval'`, no `'unsafe-inline'`). Change
    boot/dismissal behaviour HERE first, then port the same change to that
    file's `#boot` CSS/markup and `app-boot.js`'s matching logic. The
    `<head>` block above (description/canonical/OG/Twitter/JSON-LD) and the
    `<noscript>` block in `<body>` below are likewise mirrored verbatim
    (module-hash references excepted) — this file and the mirror are the
    only two things any crawler ever reads for the product, since AI
    crawlers do not execute JavaScript.
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #131722; }
    #chart {
      display: block;
      width: 100%;
      height: 100%;
      /* Canvas pixel buffer is set by Rust; CSS dimensions drive logical size */
    }
    /* Boot splash — visible only until wasm init resolves and the UI has painted its
       first frame (never waits for market data), then fades out and is
       removed from the DOM. Background: dark by default, light under
       `prefers-color-scheme` for a true first visit (no stored session
       yet) — a stored `mlc.boot.bg` (see the inline script below) always
       wins over both and is applied via inline style. Colours are the
       real `dark`/`light` theme chart backgrounds
       (`mlc-core/src/theme/preset.rs`), not invented values. */
    #boot {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; color: #787b86; font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #131722;
      transition: opacity .3s;
    }
    @media (prefers-color-scheme: light) {
      #boot { background: #ffffff; }
    }
    /* The logo is the spinning magic hat (`assets/mascot/animations/
       magic_hat_turntable_quality.svg`, a self-animating SVG) — it is the
       loading indicator, so it goes away when the boot fails. */
    #boot .logo { width: 112px; height: 84px; }
    #boot.err .logo { display: none; }
    #boot .msg { color: #f23645; max-width: 480px; text-align: center; white-space: pre-wrap; }
  </style>
</head>
<body>
  <noscript>
    <h1>mylittlechart</h1>
    <p>mylittlechart is a charting terminal for crypto and stock markets: a native desktop app for Windows, macOS and Linux, and this browser version — both built in Rust with GPU-accelerated rendering.</p>
    <p>It ships 462+ technical indicators across 22 categories, 100+ drawing tools, 60+ exchange/data-provider/broker connectors, alerts, and multi-chart layouts, plus an optional local Agent API for AI-assisted charting.</p>
    <p>Source and community: <a href="https://github.com/ZENG3LD">GitHub</a>, <a href="https://discord.gg/4rCD8yaF">Discord</a>, <a href="https://t.me/mylittlechart">Telegram</a>. Release notes and posts: <a href="https://chart.example/blog/">blog</a>.</p>
  </noscript>
  <canvas id="chart" tabindex="0"></canvas>
  <div id="boot">
    <img class="logo" src="/boot-hat.svg" alt="" />
    <div class="msg" id="boot-err"></div>
  </div>
  <script>
    // Zero-flash theme match for a returning visitor: dev has no CSP
    // restriction, so this runs inline and BLOCKING, before the browser
    // paints `#boot`'s first frame — a true first visit (no stored key)
    // falls through to the CSS `prefers-color-scheme` rule above instead.
    // The web shell writes `mlc.boot.bg` wherever it applies a theme
    // (`mlc-app-shell-web/src/lib.rs`'s `write_boot_bg`) so this key can
    // never drift from what the app actually renders.
    (function() {
      try {
        var bg = localStorage.getItem('mlc.boot.bg');
        if (bg) {
          document.documentElement.style.background = bg;
          document.body.style.background = bg;
          var boot = document.getElementById('boot');
          if (boot) boot.style.background = bg;
        }
      } catch (e) { /* localStorage unavailable (private mode) — CSS default stands */ }
    })();

    // `keydown`/`keyup` listeners are on `window`, not the canvas
    // (`uzor-window-web`'s `WebWindowProvider`), specifically so keyboard
    // delivery survives DOM focus drift — clipboard (copy/cut/paste)
    // listeners are on `document` for the same reason. Nothing on this
    // page reads canvas DOM focus for input routing, so there is no
    // "must be focused for keydown to land" step here any more; a stale
    // version of this comment used to claim otherwise. `tabindex="0"`
    // stays so a keyboard user tabbing through the page can still reach
    // the canvas (there is no other focusable element on it) — the rule
    // below just keeps that from drawing an outline, since the app draws
    // its own focus/selection indicators.
    var _style = document.createElement('style');
    _style.textContent = '#chart:focus { outline: none; }';
    document.head.appendChild(_style);

    // Hide the splash logo if the mascot asset failed to load (the error may
    // fire before this script runs, so check the completed-state too).
    var _logo = document.querySelector('#boot .logo');
    if (_logo) {
      if (_logo.complete && _logo.naturalWidth === 0) _logo.style.display = 'none';
      _logo.addEventListener('error', function() { _logo.style.display = 'none'; });
    }
  </script>

  <!--
    wasm-pack outputs:
      dist/mlc-app-shell-web/mlc_app_shell_web.js       (ES module glue)
      dist/mlc-app-shell-web/mlc_app_shell_web_bg.wasm  (binary)

    Adjust the path to wherever you pointed --out-dir.
  -->
  <script>
    // Suppress the browser's native right-click menu globally so our own
    // chart context menu can paint on top of the canvas. The wasm-side
    // canvas listener in uzor-window-web does the same on the canvas
    // element, but a document-level fallback handles the case where the
    // canvas listener races the default action.
    window.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);

    // Capture unhandled errors / rejections BEFORE wasm init.
    // STORE the first error in globalThis so dev-attach --eval can pull it
    // out as a single string (avoids dev-attach's multi-arg console truncation).
    window.__MLC_FIRST_ERROR__ = null;
    window.__MLC_ERROR_COUNT__ = 0;
    function captureError(label, msg, file, line, col, errObj) {
      window.__MLC_ERROR_COUNT__++;
      if (window.__MLC_FIRST_ERROR__) return;  // keep only the first
      var stack = (errObj && errObj.stack) || '<no stack>';
      window.__MLC_FIRST_ERROR__ = JSON.stringify({
        label: label,
        msg: String(msg),
        file: file || '<none>',
        line: line || 0,
        col: col || 0,
        stack: stack
      });
      // Also dump to console as ONE message (single arg) so dev-attach gets it whole.
      console.error('[FIRST-WINDOW-ERROR] ' + window.__MLC_FIRST_ERROR__);
      // Surface it on the boot splash too, so a dead boot is not a silent
      // dark (or light) screen.
      var boot = document.getElementById('boot');
      var errBox = document.getElementById('boot-err');
      if (boot) boot.classList.add('err');
      if (errBox) errBox.textContent = String(msg || '<unknown error>');
    }
    window.addEventListener('error', function(e) {
      captureError('error', e.message, e.filename, e.lineno, e.colno, e.error);
    });
    window.addEventListener('unhandledrejection', function(e) {
      captureError('unhandledrejection', e.reason, '', 0, 0, e.reason);
    });

    // ── Network interceptors — count REST + WS traffic for debug ─────────────
    window.__FETCH_LOG__ = [];
    window.__WS_LOG__ = [];
    const _OrigFetch = window.fetch.bind(window);
    window.fetch = function(input, init) {
      const url = typeof input === 'string' ? input : (input && input.url) || '<?>';
      window.__FETCH_LOG__.push({ at: Date.now(), url: String(url).slice(0, 250) });
      return _OrigFetch(input, init);
    };
    // Per-url message counters so we can see if incoming WS frames arrive
    // (we don't log every frame — 100+/s on a busy book would balloon the log).
    window.__WS_MSG_COUNT__ = {};            // { url: total_msgs }
    window.__WS_LAST_MSG__  = {};            // { url: { at, preview } } — most recent only
    const _OrigWS = window.WebSocket;
    function WrappedWS(url, protocols) {
      const ws = protocols === undefined ? new _OrigWS(url) : new _OrigWS(url, protocols);
      const urlShort = String(url).slice(0, 80);
      window.__WS_LOG__.push({ at: Date.now(), url: String(url).slice(0, 250), event: 'new' });
      ws.addEventListener('open',  () => window.__WS_LOG__.push({ at: Date.now(), url: urlShort, event: 'open'  }));
      ws.addEventListener('error', () => window.__WS_LOG__.push({ at: Date.now(), url: urlShort, event: 'error' }));
      ws.addEventListener('close', (e) => window.__WS_LOG__.push({ at: Date.now(), url: urlShort, event: 'close', code: e.code }));
      ws.addEventListener('message', (e) => {
        window.__WS_MSG_COUNT__[urlShort] = (window.__WS_MSG_COUNT__[urlShort] || 0) + 1;
        const data = e.data;
        const preview = typeof data === 'string' ? data.slice(0, 200) : '[bin '+(data && data.byteLength)+'b]';
        window.__WS_LAST_MSG__[urlShort] = { at: Date.now(), preview: preview };
      });
      const _send = ws.send.bind(ws);
      ws.send = function(data) {
        const preview = typeof data === 'string' ? data.slice(0, 200) : '[bin]';
        window.__WS_LOG__.push({ at: Date.now(), url: String(url).slice(0,60), send: preview });
        return _send(data);
      };
      return ws;
    }
    WrappedWS.prototype = _OrigWS.prototype;
    WrappedWS.CONNECTING = _OrigWS.CONNECTING;
    WrappedWS.OPEN = _OrigWS.OPEN;
    WrappedWS.CLOSING = _OrigWS.CLOSING;
    WrappedWS.CLOSED = _OrigWS.CLOSED;
    window.WebSocket = WrappedWS;
  </script>
  <script type="module">
    import init from './mlc_app_shell_web.js';
    const mod = await init();
    // The #[wasm_bindgen(start)] fn is called automatically by init().
    // Wasm linear-memory probe (leak hunt 2026-07-26): renderer RSS grew to
    // 4+GB while the JS heap stayed ~25MB — wasm memory never shrinks, so
    // its byteLength IS the high-water mark. Poll from dev-attach:
    //   window.__MLC_WASM_MEM_MB()
    window.__MLC_WASM = mod;
    window.__MLC_WASM_MEM_MB = () => Math.round(mod.memory.buffer.byteLength / 1048576);
    // Boot splash: dismiss once the app has painted its UI (the wasm frame
    // loop sets `window.__MLC_UI_PAINTED__` after its first completed
    // render). NEVER wait for market data: a chart whose venue is
    // unreachable (CORS, 429, dead proxy) shows its own empty/error state
    // behind the splash; holding the splash for bars pinned every boot
    // forever once a shared tab with such a venue was persisted. The
    // MAX_WAIT cap covers a frame loop that never paints (captureError
    // above has already put the cause on the splash by then).
    (function dismissSplashWhenPainted() {
      var boot = document.getElementById('boot');
      if (!boot) return;
      var MAX_WAIT_MS = 6000;
      var waited = 0;
      var timer = setInterval(function() {
        waited += 100;
        var painted = window.__MLC_UI_PAINTED__ === true;
        if (!painted && waited < MAX_WAIT_MS) return;
        clearInterval(timer);
        // Two rAFs: let the painted frame actually hit the canvas before
        // the fade starts.
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            boot.style.opacity = '0';
            setTimeout(function() { boot.remove(); }, 350);
          });
        });
      }, 100);
    })();
  </script>
</body>
</html>
