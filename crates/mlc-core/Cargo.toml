[package]
name = "mylittlechart-core"
version.workspace = true
edition.workspace = true
description = "Lightweight, standalone charting library - canvas, multi-charts, sub-panes, primitives, drawing tools"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nickshouse/zengeld-chart"
keywords = ["chart", "trading", "canvas", "financial", "visualization"]
categories = ["visualization", "graphics", "rendering"]

[lib]
name = "mlc_core"

[dependencies]
web-time = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uzor = "=1.4.15"
mlc-alert-delivery = { path = "../mlc-alert-delivery", package = "mylittlechart-alert-delivery" }
mlc-vault = { path = "../mlc-vault", package = "mylittlechart-vault" }
uuid = { version = "1", features = ["v4"] }
rand.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser RNG source so uuid::v4() and getrandom-based crates compile.
getrandom = { version = "0.2", features = ["js"] }
# uuid also has its own wasm RNG feature — pulls v4 RNG through web crypto.
uuid = { version = "1", features = ["v4", "js"] }

[features]
default = []
