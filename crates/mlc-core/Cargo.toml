[package]
name = "mylittlechart-core"
version.workspace = true
edition.workspace = true
description = "Lightweight, standalone charting library - canvas, multi-charts, sub-panes, primitives, drawing tools"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nickshouse/zengeld-chart"
keywords = ["chart", "trading", "canvas", "financial", "visualization"]
categories = ["visualization", "graphics", "rendering"]

[lib]
name = "mlc_core"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uzor = "=1.4.5"
mlc-alerts = { path = "../mlc-alerts", package = "mylittlechart-alerts" }
mlc-alert-delivery = { path = "../mlc-alert-delivery", package = "mylittlechart-alert-delivery" }
uuid = { version = "1", features = ["v4"] }
aes-gcm.workspace = true
pbkdf2.workspace = true
hkdf.workspace = true
hex.workspace = true
rand.workspace = true
sha2 = "0.10"

[features]
default = []
