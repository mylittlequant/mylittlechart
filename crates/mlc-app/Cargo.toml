[package]
name = "mylittlechart-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "mlc_app"

[dependencies]
web-time = "1"
mlc-backend-core = { path = "../mlc-backend-core", package = "mylittlechart-backend-core" }
mlc-core = { path = "../mlc-core", package = "mylittlechart-core" }
mlc-layout = { path = "../mlc-layout", package = "mylittlechart-layout" }
mlc-indicators = { path = "../mlc-indicators", package = "mylittlechart-indicators" }
uzor = "=1.4.15"
mlc-sidebar-content = { path = "../mlc-sidebar-content", package = "mylittlechart-sidebar-content" }
mlc-panels = { path = "../mlc-panels", package = "mylittlechart-panels" }
mlc-alerts = { path = "../mlc-alerts", package = "mylittlechart-alerts" }
mlc-alert-delivery = { path = "../mlc-alert-delivery", package = "mylittlechart-alert-delivery" }
mlc-crypto = { path = "../mlc-crypto", package = "mylittlechart-crypto" }
uuid = { version = "1", features = ["v4"] }
mlc-live-data = { path = "../mlc-live-data", package = "mylittlechart-live-data" }
mlc-trading-manager = { path = "../mlc-trading-manager", package = "mylittlechart-trading-manager" }
digdigdig3 = "=0.3.24"
tokio = { version = "1", features = ["sync"] }
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native-only: in-app agent terminal (PTY + chat) — gate4agent hard-deps
# portable-pty / vt100 / vte / rusqlite, none of which compile to wasm32.
# On wasm we substitute a no-op stub via cfg-split in src/agent/mod.rs.
gate4agent = "=0.2.37"
vt100 = "0.15"

# ── full bridge→bubble smoke test (DUAL-TARGET) ──────────────────────────────
# tests/chart_app_smoke.rs takes the chain one layer beyond the bridge:
# build ChartApp::new_empty, seed_default_chart, drive chart.tick() in a loop,
# assert bubble.bars.last().close moves. This isolates the bubble-write path
# (BackendCore::tick_writers + ChartApp react.rs TradeUpdatePassthrough arm)
# from the canvas/render path that mlc-app-web exercises. The same body
# runs on wasm32 (headless Chrome) AND native (tokio multi-thread).

[dev-dependencies]
mlc-live-data = { path = "../mlc-live-data", package = "mylittlechart-live-data" }
digdigdig3-station = "=0.3.24"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
futures-util = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
