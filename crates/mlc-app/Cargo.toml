[package]
name = "mylittlechart-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "mlc_app"

[dependencies]
web-time = "1"
mlc-backend = { path = "../mlc-backend", package = "mylittlechart-backend" }
mlc-core = { path = "../mlc-core", package = "mylittlechart-core" }
mlc-app-layout = { path = "../mlc-app-layout", package = "mylittlechart-app-layout" }
mlc-backend-indicator-engine = { path = "../mlc-backend-indicator-engine", package = "mylittlechart-backend-indicator-engine" }
uzor = "=1.5.3"
mlc-app-sidebar-content = { path = "../mlc-app-sidebar-content", package = "mylittlechart-app-sidebar-content" }
mlc-app-panels = { path = "../mlc-app-panels", package = "mylittlechart-app-panels" }
mlc-alert-delivery = { path = "../mlc-alert-delivery", package = "mylittlechart-alert-delivery" }
mlc-vault = { path = "../mlc-vault", package = "mylittlechart-vault" }
# `MessengerProvider` / `MessengerIntent` — the seam `ChartApp::set_messenger_provider`
# hands the Messages tab an outside (Matrix-shaped) provider through. A pure-std,
# zero-dependency leaf, already a dependency of `mlc-app-layout`.
mlc-messenger-model = { path = "../mlc-messenger-model", package = "mylittlechart-messenger-model" }
# Billing wire models for the checkout bridge (`checkout_bridge.rs`): models
# only, the fetch transport stays in the web shell. Cloud builds only.
mlc-cloud = { path = "../mlc-cloud", package = "mylittlechart-cloud", optional = true }
uuid = { version = "1", features = ["v4"] }
mlc-backend-data-bridge = { path = "../mlc-backend-data-bridge", package = "mylittlechart-backend-data-bridge" }
mlc-backend-trading-engine = { path = "../mlc-backend-trading-engine", package = "mylittlechart-backend-trading-engine" }
digdigdig3 = "=0.3.31"
# Book levels come off the shared station trackers as `Decimal` — the same
# conversion the DOM panels do on their side of the handle.
rust_decimal = "1"
tokio = { version = "1", features = ["sync"] }
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native-only: in-app agent terminal (PTY + chat). gate4agent 0.4.8 does
# not compile to wasm32 (tokio process, vt100) and does not link sqlite.
# On wasm the stub in src/agent/mod.rs replaces it.
gate4agent = "=0.4.8"
vt100 = "0.15"

# ── full bridge→bubble smoke test (DUAL-TARGET) ──────────────────────────────
# tests/chart_app_smoke.rs takes the chain one layer beyond the bridge:
# build ChartApp::new_empty, seed_default_chart, drive chart.tick() in a loop,
# assert bubble.bars.last().close moves. This isolates the bubble-write path
# (BackendCore::tick_writers + ChartApp react.rs TradeUpdatePassthrough arm)
# from the canvas/render path that mlc-app-shell-web exercises. The same body
# runs on wasm32 (headless Chrome) AND native (tokio multi-thread).

[dev-dependencies]
mlc-backend-data-bridge = { path = "../mlc-backend-data-bridge", package = "mylittlechart-backend-data-bridge" }
digdigdig3-station = "=0.3.31"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
futures-util = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"

[lints]
workspace = true

[features]
default = []
cloud = ["mlc-core/cloud", "mlc-app-layout/cloud", "dep:mlc-cloud"]
