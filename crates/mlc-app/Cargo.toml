[package]
name = "mylittlechart-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "mlc_app"

[dependencies]
web-time = "1"
mlc-backend = { path = "../mlc-backend", package = "mylittlechart-backend" }
mlc-core = { path = "../mlc-core", package = "mylittlechart-core" }
mlc-app-layout = { path = "../mlc-app-layout", package = "mylittlechart-app-layout" }
mlc-backend-indicator-engine = { path = "../mlc-backend-indicator-engine", package = "mylittlechart-backend-indicator-engine" }
uzor = "=1.4.15"
mlc-app-sidebar-content = { path = "../mlc-app-sidebar-content", package = "mylittlechart-app-sidebar-content" }
mlc-app-panels = { path = "../mlc-app-panels", package = "mylittlechart-app-panels" }
mlc-alert-delivery = { path = "../mlc-alert-delivery", package = "mylittlechart-alert-delivery" }
mlc-vault = { path = "../mlc-vault", package = "mylittlechart-vault" }
uuid = { version = "1", features = ["v4"] }
mlc-backend-data-bridge = { path = "../mlc-backend-data-bridge", package = "mylittlechart-backend-data-bridge" }
mlc-backend-trading-engine = { path = "../mlc-backend-trading-engine", package = "mylittlechart-backend-trading-engine" }
digdigdig3 = "=0.3.25"
tokio = { version = "1", features = ["sync"] }
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native-only: in-app agent terminal (PTY + chat) — gate4agent hard-deps
# portable-pty / vt100 / vte / rusqlite, none of which compile to wasm32.
# On wasm we substitute a no-op stub via cfg-split in src/agent/mod.rs.
gate4agent = "=0.2.37"
vt100 = "0.15"

# ── full bridge→bubble smoke test (DUAL-TARGET) ──────────────────────────────
# tests/chart_app_smoke.rs takes the chain one layer beyond the bridge:
# build ChartApp::new_empty, seed_default_chart, drive chart.tick() in a loop,
# assert bubble.bars.last().close moves. This isolates the bubble-write path
# (BackendCore::tick_writers + ChartApp react.rs TradeUpdatePassthrough arm)
# from the canvas/render path that mlc-app-shell-web exercises. The same body
# runs on wasm32 (headless Chrome) AND native (tokio multi-thread).

[dev-dependencies]
mlc-backend-data-bridge = { path = "../mlc-backend-data-bridge", package = "mylittlechart-backend-data-bridge" }
digdigdig3-station = "=0.3.25"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
futures-util = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
