[package]
name = "mlc-shell-web2"
description = "mylittlechart browser shell on uzor-framework/web: one chart (mlc-chart-view) on a canvas."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "mlc_shell_web2"
crate-type = ["cdylib", "rlib"]

[features]
# Live Binance bars through the data bridge (bigger wasm). Off: demo candles only.
live = ["mlc-chart-view/live"]
# Dev control in the browser (`?dev=1` → window.__uzorDev / __mlcDev). Dev builds only.
dev-control = ["uzor-framework/dev-control", "mlc-chart-view/dev-control"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
mlc-chart-view = { version = "0.5.656", path = "../mlc-chart-view" }
uzor-framework = { version = "=1.5.35", default-features = false, features = ["web"] }
# Same version as the wasm-bindgen CLI build-web.sh runs (0.2.129).
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Navigator"] }
# No logger in the browser: compile the log statements out.
log = { version = "0.4", features = ["max_level_off"] }

[lints]
workspace = true
