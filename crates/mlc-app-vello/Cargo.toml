[package]
name = "mylittlechart-app-vello"
version.workspace = true
edition.workspace = true
description = "Standalone chart vello/winit runner — like terminal-vello but for chart-app"

[[bin]]
name = "mylittlechart"
path = "src/main.rs"

[dependencies]
mlc-diagnostics = { path = "../mlc-diagnostics", package = "mylittlechart-diagnostics" }
mlc-app = { path = "../mlc-app", package = "mylittlechart-app" }
mlc-sidebar-content = { path = "../mlc-sidebar-content", package = "mylittlechart-sidebar-content" }
mlc-alert-delivery = { path = "../mlc-alert-delivery", package = "mylittlechart-alert-delivery" }
mlc-live-data = { path = "../mlc-live-data", package = "mylittlechart-live-data" }
mlc-bar-service = { path = "../mlc-bar-service", package = "mylittlechart-bar-service" }
mlc-trade-service = { path = "../mlc-trade-service", package = "mylittlechart-trade-service" }
mlc-orderbook-service = { path = "../mlc-orderbook-service", package = "mylittlechart-orderbook-service" }
mlc-vello-context = { path = "../mlc-vello-context", package = "mylittlechart-vello-context" }
mlc-core = { path = "../mlc-core", package = "mylittlechart-core" }
uzor = "=1.4.5"
vello = "0.8"
winit = "0.30"
pollster = "0.4"
png = "0.17"
arboard = "3"
tokio = { version = "1", features = ["sync"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
mlc-agentic-server = { path = "../mlc-agentic-server", package = "mylittlechart-agentic-server" }
mlc-indicators = { path = "../mlc-indicators", package = "mylittlechart-indicators" }
sysinfo = "0.34"
mlc-instanced-context = { path = "../mlc-instanced-context", package = "mylittlechart-instanced-context" }
uzor-render-wgpu-instanced = "=1.4.5"
mlc-vello-cpu-context = { path = "../mlc-vello-cpu-context", package = "mylittlechart-vello-cpu-context" }
mlc-vello-hybrid-context = { path = "../mlc-vello-hybrid-context", package = "mylittlechart-vello-hybrid-context" }
uzor-render-vello-hybrid = "=1.4.5"
vello_hybrid = { version = "0.0.7", features = ["wgpu"] }
mlc-tiny-skia-context = { path = "../mlc-tiny-skia-context", package = "mylittlechart-tiny-skia-context" }
keyring = "3"

[build-dependencies]
winresource = "0.1"

[features]
default = []
