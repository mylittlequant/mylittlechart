[package]
name = "mylittlechart-headless-core"
version.workspace = true
edition.workspace = true
description = "Render-agnostic Agent API plumbing — snapshot builders + command dispatch over ChartApp"

[lib]
name = "mlc_headless_core"

[dependencies]
mlc-app = { path = "../mlc-app", package = "mylittlechart-app" }
mlc-core = { path = "../mlc-core", package = "mylittlechart-core" }
mlc-agentic-server = { path = "../mlc-agentic-server", package = "mylittlechart-agentic-server" }
mlc-indicators = { path = "../mlc-indicators", package = "mylittlechart-indicators" }
mlc-live-data = { path = "../mlc-live-data", package = "mylittlechart-live-data" }
mlc-sidebar-content = { path = "../mlc-sidebar-content", package = "mylittlechart-sidebar-content" }
uzor = "=1.4.15"
tokio = { version = "1", features = ["sync"] }
serde_json = "1"
