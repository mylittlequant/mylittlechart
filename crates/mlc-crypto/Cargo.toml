[package]
name = "mylittlechart-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zero-trust blob primitives — AES-GCM, HKDF, PBKDF2 + sealed vault. Pure leaf, no workspace deps."

[lib]
name = "mlc_crypto"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm.workspace = true
pbkdf2.workspace = true
hkdf.workspace = true
hex.workspace = true
rand.workspace = true
sha2 = "0.10"
