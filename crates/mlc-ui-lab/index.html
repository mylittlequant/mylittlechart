<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>mlc-ui-lab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #131722; }
    #chart {
      display: block;
      width: 100%;
      height: 100%;
      /* Canvas pixel buffer is set by Rust; CSS dimensions drive logical size */
    }
  </style>
</head>
<body>
  <canvas id="chart" tabindex="0"></canvas>
  <script>
    // The canvas must be focusable AND focused for keydown events to land —
    // same requirement as mlc-app-shell-web (uzor-window-web's keydown
    // listener is on the canvas element, not on document/window).
    document.addEventListener('DOMContentLoaded', function () {
      var c = document.getElementById('chart');
      if (c) { c.focus(); }
    });
    window.addEventListener('pointerdown', function () {
      var c = document.getElementById('chart');
      if (c && document.activeElement !== c) c.focus();
    }, true);
    var _style = document.createElement('style');
    _style.textContent = '#chart:focus { outline: none; }';
    document.head.appendChild(_style);
    window.addEventListener('contextmenu', function (e) { e.preventDefault(); }, false);
  </script>

  <!--
    wasm-pack outputs (via `wasm-pack build --dev --target web --out-dir pkg`):
      pkg/mlc_ui_lab.js       (ES module glue)
      pkg/mlc_ui_lab_bg.wasm  (binary)
  -->
  <script type="module">
    import init, {
      lab_modals, lab_open_type, lab_open_app, lab_tab, lab_close, lab_snapshot, lab_metrics, lab_dump_types,
    } from './pkg/mlc_ui_lab.js';
    await init();
    // The #[wasm_bindgen(start)] fn runs automatically inside init().

    // Agent control plane — mirrors sim/sim.js's own `window.__SIM` (see
    // that file's own doc). Each `lab_*` export returns a JSON string (no
    // serde in the Rust crate); this wrapper is the one place that parses
    // it back into a plain object, so every `window.__LAB` method reads
    // exactly like `__SIM`'s. See README.md for the full call reference.
    window.__LAB = {
      modals: () => JSON.parse(lab_modals()),
      // Opens the CONCEPT modal (2026-08-10) — tried against the 14
      // object archetypes first, then the 9 application archetypes (see
      // `lab_modals`'s own Rust doc). The production primitive-settings
      // modal moved to the shell's own launcher "Production modals"
      // section — still reachable in the UI, just not through this call.
      open_type: (typeId, tab) => JSON.parse(lab_open_type(typeId, tab ?? undefined)),
      open_app: (modalId) => JSON.parse(lab_open_app(modalId)),
      // Switches the ALREADY-OPEN concept modal's active tab — the live
      // counterpart to `open_type`'s own `tab` argument.
      tab: (tabId) => JSON.parse(lab_tab(tabId)),
      close: () => JSON.parse(lab_close()),
      snapshot: () => JSON.parse(lab_snapshot()),
      metrics: () => JSON.parse(lab_metrics()),
      // Declaration dumper (wave 5) — one row per registered primitive
      // type, built from a fresh instance of each. See `lab_dump_types`'s
      // own Rust doc for the exact schema.
      dump_types: () => JSON.parse(lab_dump_types()),
    };
  </script>
</body>
</html>
