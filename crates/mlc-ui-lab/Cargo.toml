[package]
name = "mylittlechart-ui-lab"
version.workspace = true
edition.workspace = true

[lib]
name = "mlc_ui_lab"
crate-type = ["cdylib", "rlib"]

# ── wasm UI laboratory ───────────────────────────────────────────────────────
# Hosts the REAL mlc-app-layout modal builders + uzor widgets in a browser
# page, driven by a real uzor::input::InputCoordinator, with no ChartApp /
# BackendCore / exchange data plane anywhere in the graph. The entire crate
# body is cfg-gated under #[cfg(target_arch = "wasm32")] so
# `cargo check --workspace` (native) compiles it as an empty lib — same
# pattern as mlc-app-shell-web.
#
# Build:  wasm-pack build crates/mlc-ui-lab --dev --target web --out-dir pkg
# Serve:  see README.md (port 17498)

[dependencies]
mlc-core        = { path = "../mlc-core",        package = "mylittlechart-core" }
mlc-app-layout  = { path = "../mlc-app-layout",  package = "mylittlechart-app-layout" }

# uzor web bindings — wasm32-only at runtime, unconditional in Cargo.toml so
# cargo can resolve the graph on native (the cfg-gate in src/lib.rs keeps the
# code from compiling native-side).
uzor                 = "=1.5.1"
uzor-window-web      = "=1.5.1"
uzor-render-canvas2d = "=1.5.1"

wasm-bindgen = "0.2"
js-sys       = "0.3"
web-sys      = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Performance",
    "console",
] }
console_error_panic_hook = "0.1"

[lints]
workspace = true
