[package]
name = "mylittlechart-app-shell-headless"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Render-agnostic mylittlechart backend daemon. Owns ChartApp + AgentState + HTTP server, ticks at 60Hz, has no GPU."

[[bin]]
name = "mlc-app-shell-headless"
path = "src/main.rs"

[dependencies]
web-time = "1"
mlc-app = { version = "0.1.0", path = "../mlc-app", package = "mylittlechart-app" }
mlc-core = { version = "0.5.656", path = "../mlc-core", package = "mylittlechart-core" }
mlc-app-agent-api = { version = "0.5.656", path = "../mlc-app-agent-api", package = "mylittlechart-app-agent-api" }
mlc-backend-shell-http = { version = "0.5.656", path = "../mlc-backend-shell-http", package = "mylittlechart-backend-shell-http" }
mlc-backend-data-bridge = { version = "0.5.656", path = "../mlc-backend-data-bridge", package = "mylittlechart-backend-data-bridge" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

[lints]
workspace = true
