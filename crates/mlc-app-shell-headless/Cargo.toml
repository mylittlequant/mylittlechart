[package]
name = "mylittlechart-app-shell-headless"
version.workspace = true
edition.workspace = true
description = "Render-agnostic mylittlechart backend daemon. Owns ChartApp + AgentState + HTTP server, ticks at 60Hz, has no GPU."

[[bin]]
name = "mlc-app-shell-headless"
path = "src/main.rs"

[dependencies]
web-time = "1"
mlc-app = { path = "../mlc-app", package = "mylittlechart-app" }
mlc-core = { path = "../mlc-core", package = "mylittlechart-core" }
mlc-app-agent-api = { path = "../mlc-app-agent-api", package = "mylittlechart-app-agent-api" }
mlc-backend-agent-server = { path = "../mlc-backend-agent-server", package = "mylittlechart-backend-agent-server" }
mlc-backend-data-bridge = { path = "../mlc-backend-data-bridge", package = "mylittlechart-backend-data-bridge" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
