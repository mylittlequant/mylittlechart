[package]
name = "mylittlechart-updater"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mlc_updater"
path = "src/lib.rs"

[dependencies]
mlc-core = { path = "../mlc-core", package = "mylittlechart-core" }
mlc-vault = { path = "../mlc-vault", package = "mylittlechart-vault" }
tokio = { version = "1", features = ["rt", "time", "sync", "process", "fs", "macros", "net", "io-util"] }
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "json"], default-features = false }
sha2 = "0.10"
ed25519-dalek.workspace = true
base64.workspace = true
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
hostname = "0.4"

[lints]
workspace = true
