[package]
name = "mylittlechart-backend-data-bridge"
version.workspace = true
edition.workspace = true

[lib]
name = "mlc_backend_data_bridge"

[dependencies]
web-time = "1"
# Chart types (Bar, Timeframe, DataProvider trait)
mlc-core = { path = "../mlc-core", package = "mylittlechart-core" }

# Concurrent hash map for per-key tracker storage (ob_trackers)
dashmap = "6"

# V5 connectors (async exchange API) — separate workspace, use path
digdigdig3 = "=0.3.30"

# Station: warm-start, persistence, gap-heal, replay over the same connectors.
# Phase 2 of the dig3+mli migration: live-data becomes a strict facade over
# Station — Station owns disk persistence + reconnect + gap fill; live-data
# only translates between station Events and the legacy LiveUpdate API the
# rest of mlc still uses, plus the three channels station doesn't cover
# (private streams, scroll-left pagination, exchange_info).
digdigdig3-station = "=0.3.30"

# Stream utilities for WebSocket event_stream() consumption
futures-util = "0.3"

# JSON parsing for mini ticker WebSocket messages
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native: full tokio for the runtime that wraps station's async API.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Wasm: tokio sync+macros only; no runtime, no rt-multi-thread, no time
# (timers come from gloo-timers via station's wasm path).
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
wasm-bindgen-futures = "0.4"
# Browser timer for the wasm side of `sleep_ms` (setTimeout-backed); the
# native side uses `tokio::time::sleep` which would panic on wasm because
# `tokio::time::Instant::now()` calls into `std::time::Instant::now()`.
gloo-timers = { version = "0.3", features = ["futures"] }
# console::log_1 for bridge dlog! macro on wasm (eprintln! goes to stderr,
# invisible in the browser — we route through console.log instead).
web-sys = { version = "0.3", features = ["console"] }

# ── wasm-only dev-deps for the bridge-daemon smoke test ──────────────────────
# tests/wasm_bridge_smoke.rs verifies DataBridge::subscribe_trades delivers
# at least one LiveUpdate::TradeUpdate from Binance through a headless
# browser. Runs via `cargo test --target wasm32-unknown-unknown` driven by
# the dig2-wasm-test runner (same one dig3-station tests use).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
futures-util = "0.3"

# ── native-only dev-deps for the dual-target live e2e tests ───────────────────
# tests/derived_bars_live.rs runs the SAME body fns on both targets. On native
# it spins a tokio multi-thread runtime (`#[tokio::test(flavor="multi_thread")]`)
# so the bridge's spawn_bg tasks have an executor. Without `time` the
# `tokio::time::sleep` arm of the cross-platform sleep helper would not compile.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
