[package]
name = "mylittlechart-backend-core"
version.workspace = true
edition.workspace = true
description = "Shared data plane (bridge + bubble + indicators + trading + presets) for every mylittlechart consumer — embedded apps and the headless backend daemon."

[lib]
name = "mlc_backend_core"

[dependencies]
web-time = "1"
mlc-core = { path = "../mlc-core", package = "mylittlechart-core" }
mlc-indicators = { path = "../mlc-indicators", package = "mylittlechart-indicators" }
mlc-live-data = { path = "../mlc-live-data", package = "mylittlechart-live-data" }
mlc-trading-manager = { path = "../mlc-trading-manager", package = "mylittlechart-trading-manager" }
mlc-sidebar-content = { path = "../mlc-sidebar-content", package = "mylittlechart-sidebar-content" }
mlc-watchlist = { path = "../mlc-watchlist", package = "mylittlechart-watchlist" }
digdigdig3 = "=0.3.24"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native owns the tokio Runtime for the bridge / gate4agent; needs full rt
# (rt-multi-thread pulls mio which doesn't compile on wasm32-unknown-unknown).
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Wasm: no runtime — spawn_local handles tasks. Sync primitives only.
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
