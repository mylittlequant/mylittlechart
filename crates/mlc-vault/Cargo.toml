[package]
name = "mylittlechart-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zero-trust blob primitives — AES-GCM, HKDF, PBKDF2 + sealed vault. Pure leaf, no workspace deps."

[lib]
name = "mlc_vault"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm.workspace = true
pbkdf2.workspace = true
hkdf.workspace = true
hex.workspace = true
rand.workspace = true
sha2 = "0.10"
# RAM wipe for SecretStore — the derived vault key and the decrypted secrets
# payload are wrapped in Zeroizing so both are overwritten on drop (seal() /
# expiry), not just deallocated. Already resolves to 1.8.2 for wasm32 as a
# transitive dep of digdigdig3 (via k256/elliptic-curve/crypto-bigint), so
# adding it directly here does not change wasm buildability.
zeroize = "1"
# Instant/Duration source that works on wasm32-unknown-unknown (std::time::
# Instant panics there) — same crate mlc-core already uses for the same
# reason (see crates/mlc-core/Cargo.toml).
web-time = "1"
# Constant-time slice comparison for fingerprint checks (SecretStore /
# agent API keys). Already resolves as a transitive dep of aes-gcm (its
# Ct-choice internals), so depending on it directly here adds no new
# supply-chain surface — same reasoning as the zeroize note above.
subtle = "2"
# X25519 (DM identity keys + per-conversation ECDH, `src/dm.rs`) via
# `MontgomeryPoint::{mul_clamped, mul_base_clamped}` + `scalar::clamp_integer`
# — the whole X25519 primitive, RFC-7748 clamping included. `x25519-dalek`
# is NOT in the workspace Cargo.lock; `curve25519-dalek` already resolves to
# 4.1.3 there as a transitive dep of `ed25519-dalek` (update-signature
# verification elsewhere in the workspace), so depending on it directly here
# promotes an already-vetted, already-locked crate rather than adding a
# second curve implementation for the same math.
curve25519-dalek = "4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
# Browser RNG source so rand / pbkdf2 / aes-gcm RNG-using code paths compile.
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
