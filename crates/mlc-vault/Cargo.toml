[package]
name = "mylittlechart-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zero-trust blob primitives — AES-GCM, HKDF, PBKDF2 + sealed vault. Pure leaf, no workspace deps."

[lib]
name = "mlc_vault"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm.workspace = true
pbkdf2.workspace = true
hkdf.workspace = true
hex.workspace = true
rand.workspace = true
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
# Browser RNG source so rand / pbkdf2 / aes-gcm RNG-using code paths compile.
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
