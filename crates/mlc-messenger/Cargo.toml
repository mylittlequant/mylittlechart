[package]
name = "mylittlechart-messenger"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Sans-I/O Matrix Client-Server-subset sync + E2EE (Olm/Megolm) engine -- no network, no disk; shells execute OutgoingRequests and persist sealed records the core exports through a flush-before-send barrier."

[lib]
name = "mlc_messenger"
path = "src/lib.rs"

[dependencies]
mylittlechart-vodozemac = { path = "../mlc-vodozemac" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
# Not yet called from this piece's own code (M1: ids/error/wire/persist).
# Reserved for M3 (`wire::events`), where Matrix to-device/timeline event
# content -- Olm/Megolm ciphertext, Megolm session-key exports -- is
# base64-encoded JSON per the client-server API's own wire format; adding
# the dependency here now (per the plan's M1 scope) keeps every later
# piece's Cargo.toml diff to source files only.
base64.workspace = true

[lints]
workspace = true
