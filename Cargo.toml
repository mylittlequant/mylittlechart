[workspace]
members = [
    "crates/mlc-core",
    "crates/mlc-vault",
    "crates/mlc-vodozemac",
    "crates/mlc-messenger",
    "crates/mlc-cloud",
    "crates/mlc-updater",
    "crates/mlc-app-layout",
    "crates/mlc-app",
    "crates/mlc-app-shell-vello",
    "crates/mlc-app-input-shell",
    "crates/mlc-backend-indicator-engine",
    "crates/mlc-app-sidebar-content",
    "crates/mlc-app-panels",
    "crates/mlc-alert-delivery",
    "crates/mlc-backend-data-bridge",
    "crates/mlc-backend-shell-http",
    "crates/mlc-app-render-context-instanced",
    "crates/mlc-app-render-context-vello",
    "crates/mlc-app-render-context-vello-cpu",
    "crates/mlc-app-render-context-vello-hybrid",
    "crates/mlc-app-render-context-tiny-skia",
    "crates/mlc-shell-diagnostics",
    "crates/mlc-backend-trading-engine",
    "crates/mlc-app-test-harness",
    "crates/mlc-backend",
    "crates/mlc-backend-shell-daemon",
    "crates/mlc-backend-test-harness",
    "crates/mlc-app-shell-cli",
    "crates/mlc-app-agent-api",
    "crates/mlc-app-shell-headless",
    "crates/mlc-app-shell-web",
    "crates/mlc-ui-lab",
    "crates/mlc-messenger-model",
]
resolver = "2"

# `self.core.drawings()` (and the equivalent facades on other domain
# managers) return a type that OWNS a lock guard. Calling it directly in a
# match/if-let/while-let scrutinee keeps that guard alive for the whole
# body — so a `drawings_mut()` write inside the body re-acquires the same
# lock while still read-locked. On wasm32 `std::sync::RwLock` has no thread
# to block on: it does not deadlock, it corrupts the lock and calls
# `rtabort!`, trapping the instance for every later frame. Six sites carried
# this (fixed in 8ac92db1 + f578c868). The safe form is
# `.and_then(|bid| self.core.drawings().get_data(..))` — a closure body is
# its own temporary scope, so the guard drops on return; that shape does not
# trip this lint.
[workspace.lints.clippy]
significant_drop_in_scrutinee = "warn"

[workspace.dependencies]
rayon = "1"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
hkdf = "0.12"
hex = "0.4"
rand = "0.8"
# Restored with crates/mlc-updater (phase-1 restore from the pre-oss-strip
# stash); these two entries existed pre-strip and were dropped with the crate.
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"

[workspace.package]
version = "0.5.654"
edition = "2021"
license = "BUSL-1.1"

[profile.release]
opt-level = "s"
lto = true
debug = "line-tables-only"
strip = "none"

# Optimize indicators in dev mode to prevent stack overflow
# (large enum with 480 variants needs optimization)
[profile.dev.package.mylittlechart-backend-indicator-engine]
opt-level = 2

[patch.crates-io]
# uzor comes from crates.io. Published tip is 1.5.3 (owner 2026-10-03:
# do not path-patch the local tree; its 1.6.0-dev label is not a release).
# Pins below are "=1.5.3".
# Local dig3 path build. Pins stay at the published
# 0.3.25; the patch resolves them to the working tree so in-flight dig3
# fixes are picked up without a publish round-trip. Keep pins == published
# dig3 version on every bump; all three crates patched together so the
# graph resolves one consistent version.
digdigdig3 = { path = "../digdigdig3/crates/digdigdig3" }
digdigdig3-station = { path = "../digdigdig3/crates/digdigdig3-station" }
digdigdig3-core = { path = "../digdigdig3/crates/dig3-core" }
# Local mli (mylittleindicators) path build — same policy as uzor/dig3.
# Pin in mlc-backend-indicator-engine/Cargo.toml stays at the published
# 0.1.8; the patch resolves it to the working tree so in-flight catalog
# changes (e.g. the overlay_* opaque overlay ids) are picked up without a
# publish round-trip. Keep the pin == published mli version on every bump.
mylittleindicators = { path = "../mylittleindicators" }
