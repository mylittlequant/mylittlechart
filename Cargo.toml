[workspace]
members = [
    "crates/mlc-core",
    "crates/mlc-crypto",
    "crates/mlc-layout",
    "crates/mlc-app",
    "crates/mlc-app-vello",
    "crates/mlc-indicators",
    "crates/mlc-sidebar-content",
    "crates/mlc-panels",
    "crates/mlc-alerts",
    "crates/mlc-alert-delivery",
    "crates/mlc-live-data",
    "crates/mlc-agentic-server",
    "crates/mlc-instanced-context",
    "crates/mlc-vello-context",
    "crates/mlc-vello-cpu-context",
    "crates/mlc-vello-hybrid-context",
    "crates/mlc-tiny-skia-context",
    "crates/mlc-bar-service",
    "crates/mlc-trade-service",
    "crates/mlc-orderbook-service",
    "crates/mlc-diagnostics",
    "crates/mlc-trading-manager",
]
resolver = "2"

[workspace.dependencies]
rayon = "1"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
hkdf = "0.12"
hex = "0.4"
rand = "0.8"

[workspace.package]
version = "0.5.576"
edition = "2021"
license = "BUSL-1.1"

[profile.release]
opt-level = "s"
lto = true
debug = "line-tables-only"
strip = "none"

# Optimize indicators in dev mode to prevent stack overflow
# (large enum with 480 variants needs optimization)
[profile.dev.package.mylittlechart-indicators]
opt-level = 2

[patch.crates-io]
# VERIFICATION MODE: local uzor carries the N-ary separator-drag fix
# (Grid2x2 cross_ratio). Owner click-verifies, THEN uzor 1.4.6 gets
# published and this block is removed + pins bumped.
uzor = { path = "../uzor/uzor" }
