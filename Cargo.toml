[workspace]
members = [
    "crates/mlc-core",
    "crates/mlc-vault",
    "crates/mlc-app-layout",
    "crates/mlc-app",
    "crates/mlc-app-shell-vello",
    "crates/mlc-app-input-shell",
    "crates/mlc-backend-indicator-engine",
    "crates/mlc-app-sidebar-content",
    "crates/mlc-app-panels",
    "crates/mlc-alert-delivery",
    "crates/mlc-backend-data-bridge",
    "crates/mlc-backend-shell-http",
    "crates/mlc-app-render-context-instanced",
    "crates/mlc-app-render-context-vello",
    "crates/mlc-app-render-context-vello-cpu",
    "crates/mlc-app-render-context-vello-hybrid",
    "crates/mlc-app-render-context-tiny-skia",
    "crates/mlc-shell-diagnostics",
    "crates/mlc-backend-trading-engine",
    "crates/mlc-app-test-harness",
    "crates/mlc-backend",
    "crates/mlc-backend-shell-daemon",
    "crates/mlc-backend-test-harness",
    "crates/mlc-app-shell-cli",
    "crates/mlc-app-agent-api",
    "crates/mlc-app-shell-headless",
    "crates/mlc-app-shell-web",
]
resolver = "2"

[workspace.dependencies]
rayon = "1"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
hkdf = "0.12"
hex = "0.4"
rand = "0.8"

[workspace.package]
version = "0.5.576"
edition = "2021"
license = "BUSL-1.1"

[profile.release]
opt-level = "s"
lto = true
debug = "line-tables-only"
strip = "none"

# Optimize indicators in dev mode to prevent stack overflow
# (large enum with 480 variants needs optimization)
[profile.dev.package.mylittlechart-backend-indicator-engine]
opt-level = 2

[patch.crates-io]
# Local uzor path build. Pins below track the published version (1.4.15)
# so the manifest stays honest; the patch just resolves them to the
# working tree so in-flight uzor fixes are picked up without a publish
# round-trip. Keep pins == published uzor version on every bump.
uzor                  = { path = "../uzor/uzor" }
uzor-fonts            = { path = "../uzor/uzor-fonts" }
uzor-window-web       = { path = "../uzor/uzor-window-web" }
uzor-render-canvas2d  = { path = "../uzor/uzor-render-canvas2d" }
# Local dig3 path build — same policy as uzor. Pins stay at the published
# 0.3.23; the patch resolves them to the working tree so in-flight dig3
# fixes are picked up without a publish round-trip. Keep pins == published
# dig3 version on every bump; all three crates patched together so the
# graph resolves one consistent version.
digdigdig3 = { path = "../digdigdig3/crates/digdigdig3" }
digdigdig3-station = { path = "../digdigdig3/crates/digdigdig3-station" }
digdigdig3-core = { path = "../digdigdig3/crates/dig3-core" }
# Local mli (mylittleindicators) path build — same policy as uzor/dig3.
# Pin in mlc-backend-indicator-engine/Cargo.toml stays at the published
# 0.1.8; the patch resolves it to the working tree so in-flight catalog
# changes (e.g. the overlay_* opaque overlay ids) are picked up without a
# publish round-trip. Keep the pin == published mli version on every bump.
mylittleindicators = { path = "../mylittleindicators" }
