[workspace]
members = [
    "crates/mlc-core",
    "crates/mlc-crypto",
    "crates/mlc-layout",
    "crates/mlc-app",
    "crates/mlc-app-vello",
    "crates/mlc-indicators",
    "crates/mlc-sidebar-content",
    "crates/mlc-panels",
    "crates/mlc-alerts",
    "crates/mlc-alert-delivery",
    "crates/mlc-live-data",
    "crates/mlc-agentic-server",
    "crates/mlc-instanced-context",
    "crates/mlc-vello-context",
    "crates/mlc-vello-cpu-context",
    "crates/mlc-vello-hybrid-context",
    "crates/mlc-tiny-skia-context",
    "crates/mlc-diagnostics",
    "crates/mlc-trading-manager",
    "crates/mlc-test-harness",
    "crates/mlc-backend-core",
    "crates/mlc-backend-daemon",
    "crates/mlc-headless-core",
    "crates/mlc-headless",
]
resolver = "2"

[workspace.dependencies]
rayon = "1"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
hkdf = "0.12"
hex = "0.4"
rand = "0.8"

[workspace.package]
version = "0.5.576"
edition = "2021"
license = "BUSL-1.1"

[profile.release]
opt-level = "s"
lto = true
debug = "line-tables-only"
strip = "none"

# Optimize indicators in dev mode to prevent stack overflow
# (large enum with 480 variants needs optimization)
[profile.dev.package.mylittlechart-indicators]
opt-level = 2

[patch.crates-io]
# Local uzor path build. Pins below track the published version (1.4.13)
# so the manifest stays honest; the patch just resolves them to the
# working tree so in-flight uzor fixes are picked up without a publish
# round-trip. Keep pins == published uzor version on every bump.
uzor = { path = "../uzor/uzor" }
# Local dig3 path build — same policy as uzor. Pins stay at the published
# 0.3.23; the patch resolves them to the working tree so in-flight dig3
# fixes are picked up without a publish round-trip. Keep pins == published
# dig3 version on every bump; all three crates patched together so the
# graph resolves one consistent version.
digdigdig3 = { path = "../digdigdig3/crates/digdigdig3" }
digdigdig3-station = { path = "../digdigdig3/crates/digdigdig3-station" }
digdigdig3-core = { path = "../digdigdig3/crates/dig3-core" }
